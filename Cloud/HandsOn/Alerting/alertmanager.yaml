## We will update the current config with below config which will route the alerts to our slack

global:
  slack_api_url: 'https://hooks.slack.com/services/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'
route:
  group_by: ['alertname']
  group_wait: 5s
  group_interval: 1m
  repeat_interval: 10m
  receiver: 'slack'

receivers:
- name: 'slack'
  slack_configs:
  - channel: '#alerts'
    icon_emoji: ':bell:'
    send_resolved: true
    text: "<!channel> \nsummary: {{ .CommonAnnotations.summary }}\ndescription: {{ .CommonAnnotations.description }}\nmessage: {{ .CommonAnnotations.message }}"
