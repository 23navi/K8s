apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  labels:
    env: development
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
        - name: my-app
          image: my-app:latest 
          